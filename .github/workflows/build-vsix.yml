name: Build VSIX

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  build-vsix:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Derive VSIX version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $vsixVersion = '0.0.0.0'

          if ('${{ startsWith(github.ref, 'refs/tags/') }}' -eq 'True') {
            if ($tag -notmatch '^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)(?:-[A-Za-z][A-Za-z0-9.-]*\.(?<revision>\d+))?$') {
              throw "Tag '$tag' must use v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-<label>.<revision>."
            }

            $revision = if ($Matches['revision']) { $Matches['revision'] } else { '0' }
            $vsixVersion = "$($Matches['major']).$($Matches['minor']).$($Matches['patch']).$revision"
          }

          "vsix_version=$vsixVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Stamp VSIX version
        shell: pwsh
        env:
          VSIX_VERSION: ${{ steps.version.outputs.vsix_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceFiles = @(
            'CodeJanitor/source.extension.cs',
            'CodeJanitor.VS2026/source.extension.cs'
          )
          $manifestFiles = @(
            'CodeJanitor/source.extension.vsixmanifest',
            'CodeJanitor.VS2026/source.extension.vsixmanifest'
          )

          foreach ($file in $sourceFiles) {
            $content = Get-Content -Path $file -Raw
            $content = $content -replace 'public const string Version = "[^"]+";', "public const string Version = `"$env:VSIX_VERSION`";"
            Set-Content -Path $file -Value $content -NoNewline
          }

          foreach ($file in $manifestFiles) {
            $content = Get-Content -Path $file -Raw
            $content = $content -replace '(<Identity\b[^>]*\bVersion=")[^"]+("[^>]*>)', "`${1}$env:VSIX_VERSION`${2}"
            Set-Content -Path $file -Value $content -NoNewline
          }

      - name: Restore solution
        run: nuget restore CodeJanitor.sln

      - name: Build solution (Release)
        run: msbuild CodeJanitor.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU" /p:DeployExtension=false /m

      - name: Collect VSIX artifacts
        shell: pwsh
        env:
          VSIX_VERSION: ${{ steps.version.outputs.vsix_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null

          $vsixFiles = Get-ChildItem -Path . -Recurse -Filter *.vsix |
            Where-Object {
              $_.FullName -match '\\bin\\Release\\' -and
              $_.FullName -notmatch '\\obj\\'
            }

          if (-not $vsixFiles) {
            throw 'No VSIX files were produced in bin/Release. Build failed to generate release artifacts.'
          }

          foreach ($file in $vsixFiles) {
            $projectName = $file.Directory.Parent.Parent.Name
            $artifactName = "$projectName-$env:VSIX_VERSION.vsix"
            Copy-Item -Path $file.FullName -Destination (Join-Path artifacts $artifactName) -Force
          }

          Write-Host 'Collected VSIX files:'
          Get-ChildItem artifacts -Filter *.vsix | ForEach-Object { Write-Host $_.FullName }

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-release
          path: artifacts/*.vsix
          if-no-files-found: error

      - name: Publish GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.vsix
          draft: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.ref.replace('refs/tags/', '')
            });

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              draft: false,
              prerelease: context.ref.includes('-')
            });
